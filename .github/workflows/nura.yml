# Nura (postmarketOS) images for the ZTE Axon 7, built on GitHub's runners
# with pmbootstrap (postmarketos/scripts/nura-release.sh): a raw microSD image
# and boot.img, without any Qualcomm/ZTE firmware (the phone copies its own at
# the first start).
#
# Runs on every push to main that touches postmarketos/ (packages, scripts) or
# this workflow, and by hand. A newer push cancels a running build.
# The default login password comes from the repository variable
# NURA_DEFAULT_PASSWORD (Settings → Secrets and variables → Actions →
# Variables); the build stops if it is not set.
#
# The images go into a DRAFT release (nura-YYYYMMDD[-N], see
# .github/scripts/draft-release.sh); publish it on GitHub after testing.
# Publishing refreshes the fixed "nura-latest" release (latest.yml).
name: Nura images

on:
  push:
    branches: [main]
    paths:
      - 'postmarketos/pmaports-local/**'
      - 'postmarketos/scripts/nura-release.sh'
      - '.github/workflows/nura.yml'
      - '.github/scripts/draft-release.sh'
  workflow_dispatch:
    inputs:
      release:
        description: Put the images into a draft release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nura-images
  cancel-in-progress: true

env:
  # the pmbootstrap the port is developed with
  PMBOOTSTRAP_COMMIT: e0dfe2c
  PMB_WORK: /home/runner/pmbootstrap-work
  # the kernel package between runs (see "Kernel package from the cache")
  KERNEL_APORT: postmarketos/pmaports-local/device/testing/linux-zte-axon7
  KERNEL_CACHE: /home/runner/nura-kernel-cache

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check the default password variable
        env:
          NURA_PASSWORD: ${{ vars.NURA_DEFAULT_PASSWORD }}
        run: |
          [ -n "$NURA_PASSWORD" ] || { echo "::error::set the repository variable NURA_DEFAULT_PASSWORD (the published default login password)"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q android-sdk-libsparse-utils xz-utils
          git clone -q https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git postmarketos/pmbootstrap
          git -C postmarketos/pmbootstrap checkout -q "$PMBOOTSTRAP_COMMIT"

      - name: pmbootstrap configuration (no prompts)
        run: |
          mkdir -p ~/.config "$PMB_WORK/cache_git"
          git clone -q --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PMB_WORK/cache_git/pmaports"
          echo 8 > "$PMB_WORK/version"
          cat > ~/.config/pmbootstrap_v3.cfg <<EOF
          [pmbootstrap]
          aports = $PMB_WORK/cache_git/pmaports
          device = zte-axon7
          is_default_channel = False
          jobs = $(nproc)
          ssh_keys = False
          timezone = Europe/Berlin
          ui = console
          ui_extras = False
          user = user
          work = $PMB_WORK
          EOF
          sed -i 's/^ *//' ~/.config/pmbootstrap_v3.cfg
          python3 postmarketos/pmbootstrap/pmbootstrap.py config

      # The kernel package (linux-zte-axon7) is about 55 of the 65 minutes of a
      # clean build and changes rarely, so the built .apk is kept between runs.
      # The key covers everything in this repository that defines it: all
      # files of the package (APKBUILD, patches, config) and the pmbootstrap
      # commit. Only an exact match is used (no restore-keys), so any change
      # to the kernel builds it again; raise "v1" to throw the cache away by
      # hand. Alpine's compiler is not part of the key: GitHub drops a cache
      # that was not used for 7 days, then the kernel is built fresh.
      #
      # Only the .apk and the public key it was signed with are cached, never
      # pmbootstrap's work directory or ccache: restored files belong to the
      # runner user, and the build user inside pmbootstrap's chroot cannot
      # write to them (ccache "Permission denied", the kernel build fails).
      - name: Look for a cached kernel package
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KERNEL_CACHE }}
          key: nura-kernel-v1-${{ env.PMBOOTSTRAP_COMMIT }}-${{ hashFiles('postmarketos/pmaports-local/device/testing/linux-zte-axon7/**') }}

      # pmbootstrap builds a package only if its version (pkgver-rN) is not in
      # the index of its local repository, so the cached .apk is put there and
      # the index is made again (and signed with this run's key). Every run
      # makes a new signing key, and apk refuses packages signed with a key it
      # does not know: the public key of the run that built the kernel goes
      # next to pmbootstrap's own keys (config_apk_keys is /etc/apk/keys in
      # all chroots). If anything here fails, the package is removed again and
      # the kernel is built as usual.
      - name: Kernel package from the cache
        if: steps.kernel.outputs.cache-hit == 'true'
        run: |
          apk=linux-zte-axon7-$(sed -n 's/^pkgver=//p' "$KERNEL_APORT/APKBUILD")-r$(sed -n 's/^pkgrel=//p' "$KERNEL_APORT/APKBUILD").apk
          channel=$(sed -n 's/^channel *= *//p' "$PMB_WORK/cache_git/pmaports/pmaports.cfg")
          repo=$PMB_WORK/packages/$channel/aarch64
          if [ -z "$channel" ] || [ ! -f "$KERNEL_CACHE/$apk" ] || ! ls "$KERNEL_CACHE"/*.rsa.pub >/dev/null 2>&1; then
            echo "::warning::cached kernel package is incomplete ($apk), building the kernel"
            exit 0
          fi
          # 12345 is the build user (pmos) in pmbootstrap's chroots, it writes the index
          sudo install -d -o 12345 -g 12345 "$PMB_WORK/packages" "$PMB_WORK/packages/$channel" "$repo"
          sudo install -o 12345 -g 12345 -m 644 "$KERNEL_CACHE/$apk" "$repo/"
          sudo install -d "$PMB_WORK/config_apk_keys"
          sudo install -m 644 "$KERNEL_CACHE"/*.rsa.pub "$PMB_WORK/config_apk_keys/"
          if python3 postmarketos/pmbootstrap/pmbootstrap.py -y index \
            && sudo tar -xzOf "$repo/APKINDEX.tar.gz" APKINDEX | grep -qx "P:linux-zte-axon7"; then
            echo "using the cached $apk, the kernel is not built"
          else
            echo "::warning::could not add the cached $apk to pmbootstrap's repository, building the kernel"
            sudo rm -rf "$PMB_WORK/packages"
            for key in "$KERNEL_CACHE"/*.rsa.pub; do sudo rm -f "$PMB_WORK/config_apk_keys/$(basename "$key")"; done
          fi

      - name: Build the images
        env:
          NURA_PASSWORD: ${{ vars.NURA_DEFAULT_PASSWORD }}
        run: |
          cd postmarketos
          bash scripts/nura-release.sh
          ls -la out/release

      # Keep a freshly built kernel package, also when a later package or the
      # image failed. abuild puts a package into the index when it is
      # complete, so a half written .apk is never cached.
      - name: Kernel package for the cache
        id: kernel-built
        if: ${{ !cancelled() && steps.kernel.outcome == 'success' && steps.kernel.outputs.cache-hit != 'true' }}
        run: |
          apk=linux-zte-axon7-$(sed -n 's/^pkgver=//p' "$KERNEL_APORT/APKBUILD")-r$(sed -n 's/^pkgrel=//p' "$KERNEL_APORT/APKBUILD").apk
          channel=$(sed -n 's/^channel *= *//p' "$PMB_WORK/cache_git/pmaports/pmaports.cfg")
          repo=$PMB_WORK/packages/$channel/aarch64
          sudo tar -xzOf "$repo/APKINDEX.tar.gz" APKINDEX 2>/dev/null | grep -qx "P:linux-zte-axon7" || exit 0
          [ -f "$repo/$apk" ] || exit 0
          # the public half of this run's signing key (the private key stays here)
          [ "$(sudo sh -c "ls '$PMB_WORK'/config_abuild/*.rsa.pub" | wc -l)" = 1 ] || exit 0
          mkdir -p "$KERNEL_CACHE"
          sudo sh -c "cp '$repo/$apk' '$PMB_WORK'/config_abuild/*.rsa.pub '$KERNEL_CACHE/'"
          sudo chown -R "$(id -u):$(id -g)" "$KERNEL_CACHE"
          ls -la "$KERNEL_CACHE"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Save the kernel package
        if: ${{ !cancelled() && steps.kernel-built.outputs.found == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KERNEL_CACHE }}
          key: ${{ steps.kernel.outputs.cache-primary-key }}

      - name: pmbootstrap log (on failure)
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]|ERROR|undefined reference|No such file|FAILED" "$PMB_WORK/log.txt" | grep -v "^.*-Werror" | head -n 60 || true
          tail -n 60 "$PMB_WORK/log.txt" || true

      - name: Draft release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          NURA_PASSWORD: ${{ vars.NURA_DEFAULT_PASSWORD }}
        run: |
          cd postmarketos/out/release
          date=$(ls nura-axon7-*-boot.img | sed 's/nura-axon7-\(.*\)-boot.img/\1/')
          sed "s|@NURA_PASSWORD@|$NURA_PASSWORD|" "$GITHUB_WORKSPACE/postmarketos/release-notes.md" > "$RUNNER_TEMP/notes.md"
          bash "$GITHUB_WORKSPACE/.github/scripts/draft-release.sh" nura "$date" \
            "$RUNNER_TEMP/notes.md" \
            nura-axon7-$date-sdcard.img.xz nura-axon7-$date-boot.img SHA256SUMS-$date
