# ZTE Axon 7. Playback on MultiMedia2 (hw:N,1), capture on MultiMedia1
# (hw:N,0), so both can run at the same time.
# - Speaker: SLIMbus 0 to the AK4961, its PORT2 I2S output (SDTO2) feeds
#   the two TFA9890 amplifiers (ZTE's "speaker" mixer path).
# - Headphones: Quaternary MI2S to the Hi-Fi DAC (AK4490) on the jack.
# - Mic: microphone 1 (AIN1) through the AK4961 ADC to SLIMbus 0 TX
#   (ZTE's handset-mic path without the DSP).
# Earpiece: "Speaker Top Receiver Switch" routes the top speaker to the
# earpiece, but the bottom amplifier has no mute of its own yet, so there
# is no Earpiece device. The other microphones are not set up yet.

SectionVerb {
	EnableSequence [
		cset "name='PORT2 Sync Domain' slimbus"
		cset "name='SDTO2 Source Selector' SBI1"
		# landscape with the top of the phone to the left: top = left channel
		cset "name='Speaker Top Amp Input' Left"
		cset "name='Speaker Bottom Amp Input' Right"
		cset "name='Speaker Top Receiver Switch' off"
		cset "name='Mic_1L input Selector' AIN1"
		cset "name='SBO1L Source Selector' ADC1"
		cset "name='CP1 Clock Mode' 500kHz"
		cset "name='MIC Gain 1L' 5"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (Hi-Fi DAC)"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia2' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixerElem "Digital"
		PlaybackVolume "Digital Playback Volume"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='MultiMedia1 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='MultiMedia1 Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "MIC Gain 1L"
	}
}
