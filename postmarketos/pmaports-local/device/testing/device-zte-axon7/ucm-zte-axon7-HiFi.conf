# ZTE Axon 7, MultiMedia1 to one of two outputs:
# - Speaker: SLIMbus 0 to the AK4961, its PORT2 I2S output (SDTO2) feeds
#   the two TFA9890 amplifiers (ZTE's "speaker" mixer path).
# - Headphones: Quaternary MI2S to the Hi-Fi DAC (AK4490) on the jack.
# Earpiece and microphones (AK4961) are not supported yet.

SectionVerb {
	EnableSequence [
		cset "name='PORT2 Sync Domain' slimbus"
		cset "name='SDTO2 Source Selector' SBI1"
		cset "name='Speaker Left Amp Input' Left"
		cset "name='Speaker Right Amp Input' Right"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones (Hi-Fi DAC)"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Digital"
		PlaybackVolume "Digital Playback Volume"
	}
}
