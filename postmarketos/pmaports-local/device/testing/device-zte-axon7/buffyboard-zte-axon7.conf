# ZTE Axon 7: on-screen keyboard for the framebuffer console (buffyboard).
# Merged after /usr/share/buffyboard/buffyboard.conf (see buffyboard --help).
[keyboard]
sticky_shift=true

[theme]
default=breezy-dark

[input]
# Synaptics S3718AR touchscreen; no mouse on this phone
pointer=false
touchscreen=true

[quirks]
# the dual-DSI command-mode panel only shows what is explicitly flushed
fbdev_force_refresh=true
ignore_unused_terminals=true
