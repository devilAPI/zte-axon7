# ZTE Axon 7: on-screen keyboard for the framebuffer console (buffyboard).
# Merged after /usr/share/buffyboard/buffyboard.conf (see buffyboard --help).
[keyboard]
sticky_shift=true

[theme]
default=breezy-dark

[input]
# Synaptics S3718AR touchscreen; no mouse on this phone
pointer=false
touchscreen=true

[quirks]
# No forced refresh: LVGL's FBIOPUT_VSCREENINFO (FB_ACTIVATE_FORCE) makes
# fbcon resize every VT to full height and repaint over the keyboard. The msm
# DRM fbdev flushes ordinary writes to the command-mode panel by itself.
fbdev_force_refresh=false
ignore_unused_terminals=false
