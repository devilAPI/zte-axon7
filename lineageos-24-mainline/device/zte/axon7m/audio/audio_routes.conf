# Mixer routes of the AK4961 card for the audio HAL (hardware/interfaces patch
# 0002, ro.vendor.audio.tinyalsa.routes), from Nura's UCM (zte-axon7/HiFi.conf).
# Each route sets the whole state it needs. Playback is MultiMedia2
# (CARD_0_DEV_1), capture MultiMedia1 (CARD_0_DEV_0).

[speaker]
QUAT_MI2S_RX Audio Mixer MultiMedia2 = 0
Speaker Top Receiver Switch = off
Speaker Top Amp Input = Left
Speaker Bottom Amp Input = Left
Bottom Speaker Switch = on
Top Speaker Switch = on
SLIMBUS_0_RX Audio Mixer MultiMedia2 = 1

# the top speaker behind the earpiece opening, left channel only
[earpiece]
QUAT_MI2S_RX Audio Mixer MultiMedia2 = 0
Bottom Speaker Switch = off
Speaker Top Amp Input = Left
Speaker Top Receiver Switch = on
Top Speaker Switch = on
SLIMBUS_0_RX Audio Mixer MultiMedia2 = 1

# Hi-Fi DAC (AK4490) on Quaternary MI2S
[headphones]
SLIMBUS_0_RX Audio Mixer MultiMedia2 = 0
Top Speaker Switch = off
Bottom Speaker Switch = off
Speaker Top Receiver Switch = off
QUAT_MI2S_RX Audio Mixer MultiMedia2 = 1

# microphone 1 (bottom) left, microphone 2 (top) right
[mic]
Mic_1L input Selector = AIN1
Mic_1R input Selector = AIN2
SBO1L Source Selector = ADC1
MultiMedia1 Mixer SLIMBUS_0_TX = 1

[headset-mic]
Mic_1L input Selector = AIN4
SBO1L Source Selector = ADC1
MultiMedia1 Mixer SLIMBUS_0_TX = 1
